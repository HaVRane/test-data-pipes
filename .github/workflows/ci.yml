name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera
        run: pip install -e ".[dev]"
      - name: Kör tester
        run: python -m pytest -q
      - name: Skapa exempeldata
        run: python scripts/make_sample_data.py
      - name: Visa härledd körplan
        run: python -m excel_merge.cli plan --spec config/relations.yaml
      - name: Kör flödet på exempeldata
        run: python -m excel_merge.cli run --spec config/relations.yaml
